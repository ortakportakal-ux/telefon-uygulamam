<html lang="tr"><head><meta charset="utf-8">

<style>
/* Düzen: tek sütun, telefon öncelikli; üstte durum şeridi, altta sekme çubuğu, ortada kartlar. */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface2:#e6ebe9; --fg:#13201c; --muted:#5d6e68; --line:#d5ddda;
  --accent:#2f4be0; --accent-fg:#ffffff; --accent-soft:#e3e8fd;
  --in:#12805c; --in-soft:#dcf1e8; --out:#c2412d; --out-soft:#f9e3de; --warn:#a86a00; --warn-soft:#faefd2;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1214; --surface:#151c1f; --surface2:#1e282c; --fg:#e8f0ed; --muted:#8fa29b; --line:#27343a;
  --accent:#7b8dff; --accent-fg:#0d1214; --accent-soft:#1d2447;
  --in:#4cc79a; --in-soft:#12302a; --out:#ff8f7a; --out-soft:#35201c; --warn:#f0b94d; --warn-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1214; --surface:#151c1f; --surface2:#1e282c; --fg:#e8f0ed; --muted:#8fa29b; --line:#27343a;
  --accent:#7b8dff; --accent-fg:#0d1214; --accent-soft:#1d2447;
  --in:#4cc79a; --in-soft:#12302a; --out:#ff8f7a; --out-soft:#35201c; --warn:#f0b94d; --warn-soft:#33290f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-inline:0;margin:0}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--body)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
.tab-nums{font-variant-numeric:tabular-nums}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:110px;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.in{color:var(--in)} .out{color:var(--out)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--out);border-color:var(--out)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:38px;line-height:1.05}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:19px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--out)}
.nudge{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--accent);color:var(--accent-fg)}
.nudge.warn{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.nudge h3{font-size:19px}
.nudge .btn{background:var(--accent-fg);color:var(--accent);border-color:transparent}
.nudge.warn .btn{background:var(--surface);color:var(--fg);border-color:var(--line)}
.week{display:flex;gap:6px}
.dot{flex:1;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.dot i{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:block}
.dot.ok i{background:var(--in);border:2px solid var(--in)}
.dot.today i{border-color:var(--accent)}
.dot.zero i{background:var(--in-soft);border:2px solid var(--in)}
.dot.miss i{border-color:var(--out)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .item:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--display);flex:none;background:var(--out-soft);color:var(--out)}
.ico.in{background:var(--in-soft);color:var(--in)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 0 2px;display:flex;justify-content:space-between}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav .in-nav{display:flex;width:100%;max-width:560px;align-items:center}
nav button.t{flex:1;background:none;border:0;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
nav button.t.on{color:var(--accent)}
nav button.t svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:0;font-size:30px;line-height:1;margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.25);flex:none}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.days{display:flex;align-items:flex-end;gap:2px;height:64px}
.days i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.days i.z{background:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;font-weight:600;max-width:90%}
.parse{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
nav button.t{font-size:11px}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.alloc i{display:block;height:100%}
.c0{background:var(--accent)}.c1{background:var(--in)}.c2{background:var(--warn)}.c3{background:var(--out)}.c4{background:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tip{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:no-preference){.nudge{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.4}}}
</style>
<style>:root{color-scheme:light dark}html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}body{margin:0}[hidden]{display:none!important}</style>
</head><body><div id="app"><main id="main"></main></div>
<nav><div class="in-nav" id="nav"></div></nav>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
'use strict';
var KEY='hayatim.v1';
var EXP=['Market','Yemek','Ulaşım','Fatura','Kira','Abonelik','Alışveriş','Sağlık','Eğlence','Borç/Taksit','Diğer'];
var INC=['Maaş','Yan iş','Banka geliri','Diğer gelir'];
var MON=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var DAY=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
var RULES=[
 ['Market',/migros|bim\b|a101|şok|sok market|carrefour|market|manav|kasap|macro/],
 ['Yemek',/yemeksepeti|getir|trendyol yemek|restoran|restaurant|cafe|kafe|starbucks|kebap|burger|döner|doner|pizza|lokanta|pastane|simit|kahve/],
 ['Ulaşım',/shell|opet|petrol|\bbp\b|total|uber|bitaksi|istanbulkart|iett|otobüs|metro|marti|taksi|otopark|hgs|ogs|thy|pegasus/],
 ['Fatura',/turkcell|vodafone|türk telekom|turk telekom|enerjisa|igdaş|igdas|iski|aski|su idaresi|elektrik|doğalgaz|dogalgaz|fatura|superonline|ttnet/],
 ['Kira',/kira|apartman|aidat/],
 ['Abonelik',/netflix|spotify|youtube|apple\.com|itunes|google|prime|disney|exxen|blu ?tv|icloud|chatgpt|openai/],
 ['Alışveriş',/trendyol|hepsiburada|n11|amazon|zara|lc ?waikiki|lcw|mavi|teknosa|mediamarkt|ikea|koton|defacto/],
 ['Sağlık',/eczane|hastane|klinik|doktor|diş|optik/],
 ['Eğlence',/sinema|cinema|bilet|biletix|steam|playstation|oyun/],
 ['Borç/Taksit',/taksit|kredi|kart borç|ekstre/]
];
var STOP=/^(TL|TRY|EFT|FAST|HAVALE|KART|KARTI|VISA|MASTERCARD|BANKA|SMS|IBAN|TR\d+|BILGI|BİLGİ|HESAP|HESABINIZ.*|ISLEM|İŞLEM|TUTAR|TARIH|TARİH|SAAT)$/;

/* ---------- veri ---------- */
var mem=null;
function blank(){return {tx:[],checkins:{},bills:[],accounts:[],invs:[],learn:{},budget:0,demo:false,first:null}}
function load(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);var b=blank();for(var k in b)if(o[k]===undefined)o[k]=b[k];return o}}catch(e){}
  return mem||blank();
}
var S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var UI={tab:'today',month:ym(today()),filter:'all',q:''};

/* ---------- tarih / para ---------- */
function pad(n){return n<10?'0'+n:''+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}
function today(){return ds(new Date())}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function diff(a,b){return Math.round((pd(a)-pd(b))/864e5)}
function ym(s){return s.slice(0,7)}
function addMonthsStr(s,n){var d=pd(s);var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ds(d)}
function fmtDay(s){var d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+DAY[d.getDay()]}
function monthName(m){var p=m.split('-');return MON[+p[1]-1]+' '+p[0]}
var nf=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
var nf2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
function tl(n,d){return (d?nf2:nf).format(n)+' ₺'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function lc(s){return String(s).replace(/İ/g,'i').toLowerCase().replace(/ı/g,'i')}
function key(w){return lc(w).replace(/[^a-zçğıöşü0-9 ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ')}
function titleCase(s){return lc(s).replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()})}

/* ---------- SMS ayrıştırıcı ---------- */
function parseAmount(tok){
  tok=tok.replace(/[.,]+$/,'');
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(tok))return parseFloat(tok.replace(/\./g,'').replace(',','.'));
  if(/^\d+(,\d+)?$/.test(tok))return parseFloat(tok.replace(',','.'));
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(tok))return parseFloat(tok.replace(/,/g,''));
  if(/^\d+\.\d{1,2}$/.test(tok))return parseFloat(tok);
  return NaN;
}
function splitMsgs(text){
  var parts=text.split(/\n\s*\n/).map(function(s){return s.trim()}).filter(Boolean);
  if(parts.length===1){
    var lines=text.split('\n').map(function(s){return s.trim()}).filter(Boolean);
    if(lines.length>1&&lines.every(function(l){return /(TL|TRY|₺)/i.test(l)}))parts=lines;
  }
  return parts;
}
function guessCat(who,isIn,low){
  if(isIn)return /maaş|maas/.test(low)?'Maaş':'Banka geliri';
  var k=key(who);if(S.learn[k])return S.learn[k];
  var t=low+' '+lc(who);
  for(var i=0;i<RULES.length;i++)if(RULES[i][1].test(t))return RULES[i][0];
  return 'Diğer';
}
function guessWho(s){
  var m;
  if((m=s.match(/(?:Gönderen|Gonderen|Alıcı|Alici|Açıklama|Aciklama|İşyeri|Isyeri)\s*[:\-]\s*([^\n;]+?)(?:\.\s|\.$|\n|;|$)/i)))return m[1];
  if((m=s.match(/tarihinde\s+(.+?)\s+(?:işyerinde|isyerinde|işyeri|isyeri|yerinde|mağazasında|magazasinda)/i)))return m[1];
  if((m=s.match(/(.+?)\s+(?:işyerinde|isyerinde|işyeri|isyeri|yerinde|mağazasında|magazasinda)/i)))return m[1].split(/\s+/).slice(-3).join(' ');
  var re=/([A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ0-9&'*\-]{2,}(?:\s+[A-ZÇĞİÖŞÜ0-9&'*\-]{2,}){0,3})/g,r;
  while((r=re.exec(s))){var w=r[1].split(/\s+/).filter(function(x){return !STOP.test(x)});if(w.length)return w.join(' ')}
  return '';
}
function parseSMS(text,defDate){
  return splitMsgs(text).map(function(s){
    var m=s.match(/([\d][\d.,]*)\s*(?:TL|TRY|₺)|(?:TL|TRY|₺)\s*([\d][\d.,]*)/i);
    if(!m)return null;
    var amt=parseAmount(m[1]||m[2]);if(!(amt>0))return null;
    var low=lc(s),isIn;
    if(/hesabınızdan|hesabinizdan/.test(low))isIn=false;
    else if(/hesabınıza|hesabiniza|maaş|alacak|tahsil|iade/.test(low))isIn=true;
    else if(/harcama|alışveriş|alisveris|ödeme|odeme|çekil|cekil|kartinizla|provizyon|satın|satin|havale yapıl|gönderildi/.test(low))isIn=false;
    else isIn=/geldi|yatırıl|yatiril/.test(low);
    var dm=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4}|\d{2})(?!\d)/),date=defDate;
    if(dm&&+dm[1]<=31&&+dm[2]<=12){var y=dm[3].length===2?'20'+dm[3]:dm[3];date=y+'-'+pad(+dm[2])+'-'+pad(+dm[1])}
    var who=guessWho(s).replace(/\s+/g,' ').replace(/[.,:;\-\s]+$/,'').trim();
    who=who?(who===who.toUpperCase()?titleCase(who):who):(isIn?'Gelen para':'Bilinmeyen yer');
    return {on:true,type:isIn?'in':'out',amount:amt,who:who,cat:guessCat(who,isIn,low),date:date,src:'sms'};
  }).filter(Boolean);
}

/* ---------- hesaplar ---------- */
function covered(d){return S.checkins[d]||S.tx.some(function(t){return t.date===d})}
function firstDay(){
  var f=S.first;S.tx.forEach(function(t){if(!f||t.date<f)f=t.date});Object.keys(S.checkins).forEach(function(d){if(!f||d<f)f=d});return f;
}
function streak(){
  var t=today(),d=covered(t)?t:addDays(t,-1),n=0,f=firstDay();
  if(!f)return 0;
  while(d>=f&&covered(d)){n++;d=addDays(d,-1)}
  return n;
}
function missing(){
  var f=firstDay(),t=today(),out=[];
  if(!f)return out;
  for(var i=1;i<=7;i++){var d=addDays(t,-i);if(d>=f&&!covered(d))out.push(d)}
  return out;
}
function monthTx(m){return S.tx.filter(function(t){return ym(t.date)===m})}
function sum(a,type){return a.filter(function(t){return t.type===type}).reduce(function(s,t){return s+t.amount},0)}
function group(a,f){var o={};a.forEach(function(t){var k=f(t);o[k]=(o[k]||0)+t.amount});return Object.keys(o).map(function(k){return [k,o[k]]}).sort(function(a,b){return b[1]-a[1]})}
function nextBillDate(b){
  var t=today(),c=ym(t)+'-'+pad(Math.min(b.day,new Date(+t.slice(0,4),+t.slice(5,7),0).getDate())),k=key(b.who);
  function paidNear(d){return S.tx.some(function(x){return x.type==='out'&&key(x.who)===k&&Math.abs(diff(x.date,d))<=12})}
  if(paidNear(c))return addMonthsStr(c,1);
  return c;
}
function detect(){
  var g={};S.tx.filter(function(t){return t.type==='out'}).forEach(function(t){(g[key(t.who)]=g[key(t.who)]||[]).push(t)});
  var res=[],t=today();
  Object.keys(g).forEach(function(k){
    var a=g[k].sort(function(x,y){return x.date<y.date?-1:1});
    var months={};a.forEach(function(x){months[ym(x.date)]=1});
    if(a.length<2||Object.keys(months).length<2)return;
    var gaps=[];for(var i=1;i<a.length;i++)gaps.push(diff(a[i].date,a[i-1].date));
    gaps=gaps.filter(function(x){return x>3}).sort(function(x,y){return x-y});if(!gaps.length)return;
    var med=gaps[Math.floor(gaps.length/2)];if(med<26||med>35)return;
    var last=a[a.length-1];
    res.push({who:last.who,amount:last.amount,cat:last.cat,date:addMonthsStr(last.date,1),auto:true,k:k});
  });
  return res.filter(function(r){return diff(r.date,t)>=-5});
}
function upcoming(){
  var t=today(),bills=S.bills.map(function(b){return {id:b.id,who:b.who,amount:b.amount,cat:b.cat,date:nextBillDate(b),auto:false,k:key(b.who)}});
  var keys={};bills.forEach(function(b){keys[b.k]=1});
  var all=bills.concat(detect().filter(function(r){return !keys[r.k]}));
  return all.filter(function(r){return diff(r.date,t)<=14}).sort(function(a,b){return a.date<b.date?-1:1});
}
function whenLabel(d){var n=diff(d,today());return n===0?'bugün':n===1?'yarın':n>1?n+' gün sonra':Math.abs(n)+' gün gecikti'}

/* ---------- görünüm ---------- */

function viewToday(){
  var t=today(),h=new Date().getHours(),m=monthTx(ym(t)),inc=sum(m,'in'),exp=sum(m,'out'),st=streak(),miss=missing(),h2='';
  var tt=S.tx.filter(function(x){return x.date===t});

  var left=null;
  if(S.budget>0){
    var dim=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate(),dleft=dim-new Date().getDate()+1;
    left=S.budget-exp;h2={left:left,perDay:left>0?left/dleft:0};
  }
  var o='';
  if(S.demo)o+='<div class="banner"><span>Bu bir örnek veri. Kendi kayıtlarını girmeden önce temizle.</span><button class="btn sm" data-act="clearDemo">Temizle</button></div>';

  if(!covered(t)){
    var late=h>=20;

      '<div class="small" style="opacity:.9">'+(st>0?st+' günlük serin bozulmasın. ':'')+'SMS metnini yapıştır, tek dokunuşla ekle ya da harcama yapmadıysan öyle işaretle.</div>'+
      '<div class="row wrap"><button class="btn" data-act="paste">SMS yapıştır</button><button class="btn" data-act="add">Elle ekle</button><button class="btn" data-act="zero" data-d="'+t+'">Harcamadım</button></div></div>';
  }else{
    o+='<div class="card"><div class="row"><div class="grow"><b>Bugün kayıtlı</b><div class="small muted">'+(tt.length?tt.length+' hareket'+(todayOut?', '+tl(todayOut)+' harcama':''):'Harcama yok olarak işaretlendi')+'</div></div><button class="btn sm" data-act="paste">SMS ekle</button></div></div>';
  }
  /* eksik günler */
  if(miss.length){
    o+='<div class="nudge warn"><h3>'+miss.length+' gün boş kalmış</h3><div class="list" style="gap:0">'+miss.map(function(d){
      return '<div class="row" style="padding:6px 0"><div class="grow">'+fmtDay(d)+'</div><button class="btn sm" data-act="zero" data-d="'+d+'">Harcamam yoktu</button><button class="btn sm" data-act="addday" data-d="'+d+'">Ekle</button></div>'}).join('')+'</div></div>';
  }

  var wk='';for(var i=6;i>=0;i--){var d=addDays(t,-i),f=firstDay(),c=covered(d),z=S.checkins[d]&&!S.tx.some(function(x){return x.date===d});
    wk+='<div class="dot '+(c?(z?'zero':'ok'):(d===t?'today':(f&&d>=f?'miss':'')))+'"><i></i>'+DAY[pd(d).getDay()]+'</div>'}
  o+='<div class="card"><div class="row"><div class="grow"><h3 class="num" style="font-size:26px">'+st+' gün seri</h3><div class="small muted">'+(st?'Her gün bir kayıt ya da "harcamadım" seriyi sürdürür.':'Bugün bir kayıt gir, seri başlasın.')+'</div></div></div><div class="week">'+wk+'</div></div>';
  /* bu ay */
  o+='<div class="card hero"><h2>'+monthName(ym(t))+'</h2><div class="split"><div class="stat"><span class="small muted">Gelen</span><b class="num in">'+tl(inc)+'</b></div><div class="stat"><span class="small muted">Giden</span><b class="num out">'+tl(exp)+'</b></div></div>'+
    '<div class="small muted">Net: <b class="tab-nums '+(inc-exp>=0?'in':'out')+'">'+(inc-exp>=0?'+':'−')+tl(Math.abs(inc-exp))+'</b></div>';
  if(S.budget>0){var pct=Math.min(100,exp/S.budget*100);
    o+='<div class="bar '+(exp>S.budget?'over':'')+'"><i style="width:'+pct+'%"></i></div><div class="small muted">Bütçe '+tl(S.budget)+' · '+(h2.left>=0?'kalan <b>'+tl(h2.left)+'</b>, günlük yaklaşık <b>'+tl(h2.perDay)+'</b>':'<b class="out">'+tl(-h2.left)+' aştın</b>')+'</div>';
  }else o+='<div class="small muted">Aylık bütçe belirlersen günlük harcama payın burada görünür (Özet sekmesi).</div>';

/* ---------- varlık ---------- */
var ITYPES=['Mevduat','Altın','Döviz','Hisse','Fon','Kripto','Diğer'];
var GROUP={Mevduat:'Mevduat / likit',Altın:'Altın',Döviz:'Döviz',Hisse:'Hisse / fon',Fon:'Hisse / fon',Kripto:'Diğer',Diğer:'Diğer'};
var TARGET=[['Mevduat / likit',35],['Altın',25],['Hisse / fon',25],['Döviz',15]];
function cashTotal(){return S.accounts.reduce(function(s,a){return s+a.balance},0)}
function invVal(i){return i.value>0?i.value:i.invested}
function avgMonthlyExpense(){
  var m={};S.tx.forEach(function(t){if(t.type==='out')m[ym(t.date)]=(m[ym(t.date)]||0)+t.amount});
  var ks=Object.keys(m).sort().slice(-3);
  if(ks.length)return ks.reduce(function(s,k){return s+m[k]},0)/ks.length;
  return S.budget||0;
}
function advice(){
  var cash=cashTotal(),exp=avgMonthlyExpense(),up=upcoming().reduce(function(s,b){return s+b.amount},0);
  var buffer=exp*3,surplus=cash-up-buffer;
  var inv=S.invs,tot=inv.reduce(function(s,i){return s+invVal(i)},0),gs={};
  inv.forEach(function(i){var g=GROUP[i.type]||'Diğer';gs[g]=(gs[g]||0)+invVal(i)});
  var out={cash:cash,exp:exp,up:up,buffer:buffer,surplus:surplus,rows:[],notes:[]};
  if(!(exp>0)){out.notes.push('Acil durum payını hesaplamak için birkaç harcama gir ya da aylık bütçe belirle.');return out}
  if(surplus<=0){
    out.notes.push('Nakdin şu an acil durum payının ('+tl(buffer)+', yaklaşık 3 aylık gider) ve yaklaşan ödemelerin altında. Yatırım yerine önce bu payı tamamlamak mantıklı.');
    return out;
  }
  var after=tot+surplus,need=TARGET.map(function(t){return [t[0],Math.max(0,after*t[1]/100-(gs[t[0]]||0))]}),nsum=need.reduce(function(s,n){return s+n[1]},0);
  if(nsum>0)need.forEach(function(n){var amt=Math.round(surplus*n[1]/nsum/100)*100;if(amt>0)out.rows.push([n[0],amt])});
  var crypto=inv.filter(function(i){return i.type==='Kripto'}).reduce(function(s,i){return s+invVal(i)},0);
  if(tot>0&&crypto/tot>0.1)out.notes.push('Kripto portföyünün %'+Math.round(crypto/tot*100)+'\'ini oluşturuyor. Genelde %10 altında tutulması önerilir.');
  var big=Object.keys(gs).sort(function(a,b){return gs[b]-gs[a]})[0];
  if(tot>0&&big&&gs[big]/tot>0.6)out.notes.push('Yatırımlarının %'+Math.round(gs[big]/tot*100)+'\'i tek grupta ('+big+'). Çeşitlendirmek riski azaltır.');
  return out;
}

  /* nakit */

  if(ad.rows.length)o+='<div class="tip"><b>Dağıtım önerisi</b>'+ad.rows.map(function(r){return '<div class="row"><span class="grow">'+esc(r[0])+'</span><b class="tab-nums">'+tl(r[1])+'</b></div>'}).join('')+'<div class="small muted">Hedef karışım: %35 mevduat/likit, %25 altın, %25 hisse/fon, %15 döviz. Mevcut yatırımların dikkate alındı; eksik kalan gruba daha çok pay verildi.</div></div>';
  ad.notes.forEach(function(n){o+='<div class="small">• '+esc(n)+'</div>'});
  o+='<div class="small muted">Bu hesap genel bir kural özetidir, yatırım tavsiyesi değildir. Canlı fiyat kullanmaz; değerleri sen güncellersin.</div></div>';

  o+='<div class="card"><div class="row"><h2 class="grow">Yatırımlarım</h2><button class="btn sm" data-act="addinv">+ Yatırım</button></div>';
  if(inv.length){
    o+='<div class="small muted">Yatırılan '+tl(invested)+' · şimdi '+tl(val)+' · <b class="'+(pl>=0?'in':'out')+'">'+(pl>=0?'+':'−')+tl(Math.abs(pl))+(invested>0?' (%'+Math.round(pl/invested*100)+')':'')+'</b></div>';
    o+='<div class="list">'+inv.map(function(i){var p=invVal(i)-i.invested;return '<button class="item" data-act="editinv" data-id="'+i.id+'"><div class="ico '+(p>=0?'in':'')+'">'+esc(i.type.charAt(0))+'</div><div class="grow"><div class="ellip" style="font-weight:600">'+esc(i.name)+'</div><div class="small muted ellip">'+esc(i.type)+' · yatırılan '+tl(i.invested)+(i.value>0?'':' · güncel değer girilmedi')+'</div></div><div style="text-align:right"><div class="num tab-nums">'+tl(invVal(i))+'</div><div class="small tab-nums '+(p>=0?'in':'out')+'">'+(p>=0?'+':'−')+tl(Math.abs(p))+'</div></div></button>'}).join('')+'</div>';
  }else o+='<div class="small muted">Altın, döviz, hisse, fon gibi yatırımlarını ekle: kaç TL yatırdın, şimdi ne kadar ediyor. Kâr/zarar ve dağılım otomatik görünür.</div>';
  return o+'</div>';
}

/* ---------- aylık gidiş ve dikkat çeken harcamalar ---------- */
var FLEX=['Yemek','Alışveriş','Eğlence','Abonelik'];
function mStats(m){
  var a=monthTx(m),t=today(),dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),el=m===ym(t)?+t.slice(8):(m>ym(t)?0:dim);
  return {m:m,in:sum(a,'in'),out:sum(a,'out'),dim:dim,el:el,n:a.length};
}
function trendCard(){
  var ms=[],i;for(i=5;i>=0;i--)ms.push(mStats(ym(addMonthsStr(UI.month+'-01',-i))));
  while(ms.length&&!ms[0].n)ms.shift();
  if(!ms.length)return '';
  var mx=0;ms.forEach(function(x){mx=Math.max(mx,x.in,x.out)});if(!mx)return '';
  var cur=ms[ms.length-1],prev=ms.length>1?ms[ms.length-2]:null,verdict='';
  if(prev&&prev.n&&cur.el>=3&&prev.out>0&&cur.out>=0){
    var ch=(cur.out/cur.el-prev.out/prev.el)/(prev.out/prev.el),pc=Math.round(Math.abs(ch)*100);
    verdict=Math.abs(ch)<0.05?'<div class="tip"><b>Geçen ayla aşağı yukarı aynı</b><span class="small">Günlük harcama ortalaman geçen ayla neredeyse aynı.</span></div>':
      ch<0?'<div class="tip" style="background:var(--in-soft)"><b class="in">İyiye gidiyorsun</b><span class="small">Günlük harcama ortalaman geçen aya göre %'+pc+' düşük.</span></div>':
      '<div class="tip" style="background:var(--out-soft)"><b class="out">Harcama artıyor</b><span class="small">Günlük harcama ortalaman geçen aya göre %'+pc+' yüksek.</span></div>';
  }
  var o='<div class="card"><h2>Aylık gidiş</h2>'+verdict+'<div class="row" style="align-items:flex-end;gap:4px;height:120px" role="img" aria-label="Aylık gelir ve gider grafiği">'+
   ms.map(function(x){return '<div class="grow" style="display:flex;gap:3px;align-items:flex-end;height:100%;justify-content:center"><i style="display:block;width:38%;max-width:22px;border-radius:3px 3px 0 0;background:var(--in);height:'+Math.max(2,x.in/mx*100)+'%"></i><i style="display:block;width:38%;max-width:22px;border-radius:3px 3px 0 0;background:var(--out);height:'+Math.max(2,x.out/mx*100)+'%"></i></div>'}).join('')+'</div>'+
   '<div class="row" style="gap:4px">'+ms.map(function(x){var net=x.in-x.out;return '<div class="grow small" style="text-align:center;min-width:0"><div style="font-weight:600">'+MON[+x.m.slice(5)-1].slice(0,3)+'</div><div class="tab-nums out" style="font-size:11px">−'+nf.format(x.out)+'</div><div class="tab-nums '+(net>=0?'in':'out')+'" style="font-size:11px">'+(net>=0?'+':'−')+nf.format(Math.abs(net))+'</div></div>'}).join('')+'</div>'+
   '<div class="small muted"><span class="sw" style="background:var(--in)"></span>Gelen <span class="sw" style="background:var(--out);margin-left:8px"></span>Giden · altta sırayla gider ve net (gelen − giden)</div></div>';
  return o;
}
function attention(m){
  var a=monthTx(m).filter(function(t){return t.type==='out'}),exp=sum(a,'out'),items=[];
  if(!a.length)return '';
  var st=mStats(m),frac=st.el&&st.dim?st.el/st.dim:1;
  /* geçmiş ortalamaya göre yükselen kategoriler */
  var hist=[];for(var i=1;i<=3;i++){var hm=ym(addMonthsStr(m+'-01',-i)),h=monthTx(hm).filter(function(t){return t.type==='out'});if(h.length)hist.push(h)}
  if(hist.length){
    var cur=group(a,function(t){return t.cat});
    cur.forEach(function(c){
      var avg=hist.reduce(function(s,h){return s+sum(h.filter(function(t){return t.cat===c[0]}),'out')},0)/hist.length;
      var proj=frac>=0.25?c[1]/frac:c[1];
      if(avg>0&&proj>avg*1.25&&proj-avg>300)items.push(['out','▲ '+c[0]+' yükseliyor','Önceki '+hist.length+' ay ortalaman '+tl(avg)+', bu ay şimdiden '+tl(c[1])+(frac<1?' (ay sonu tahmini '+tl(proj)+')':'')+'.']);
    });
  }
  /* isteğe bağlı harcamalar */
  var fl=a.filter(function(t){return FLEX.indexOf(t.cat)>=0}),fs=sum(fl,'out');
  if(fs>0)items.push(['warn','İsteğe bağlı harcamalar: '+tl(fs),'Yemek, alışveriş, eğlence ve abonelikler giderlerinin %'+Math.round(fs/exp*100)+'\'i. İlk bakılacak yer burası.']);
  /* küçük ama sık */
  var by={};a.forEach(function(t){var k=key(t.who);(by[k]=by[k]||{who:t.who,n:0,s:0,flex:FLEX.indexOf(t.cat)>=0});by[k].n++;by[k].s+=t.amount});

  else if(a==='clearDemo'){S.tx=S.tx.filter(function(x){return !x.demo});S.accounts=S.accounts.filter(function(x){return !x.demo});S.invs=S.invs.filter(function(x){return !x.demo});S.demo=false;save();render();toast('Örnek veri silindi')}
  else if(a==='wipe'){
    if(el.dataset.sure){S=blank();save();render();toast('Tüm veri silindi')}
    else{el.dataset.sure=1;el.textContent='Emin misin? Tekrar dokun'}
  }
  else if(a==='backup')saveFile('hayatim-yedek-'+today()+'.json',JSON.stringify(S),'application/json');
  else if(a==='csv')saveFile('hayatim-hareketler-'+today()+'.csv',csvText(),'text/csv');
});
function readMan(){
  if(!$('fa'))return {};
  var f={amount:$('fa').value,who:$('fw').value,date:$('fd').value,note:$('fn').value};
  SH.t={amount:f.amount,who:f.who,note:f.note};if(f.date)SH.date=f.date;return f;
}
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='pt'&&SH){SH.text=el.value;SH.items=parseSMS(el.value,today());drawPreview()}
  else if(el.id==='q'){UI.q=el.value;var p=el.selectionStart;render();var q=$('q');q.focus();q.setSelectionRange(p,p)}
  else if(el.id==='budget'){S.budget=parseAmount(el.value.trim())||0;save()}
  else if(el.id==='fw'&&SH&&!SH.cat&&SH.type==='out'){var c=S.learn[key(el.value)];if(c){SH.cat=c;[].forEach.call(document.querySelectorAll('#cc .chip'),function(b){b.classList.toggle('on',b.dataset.v===c)})}}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.f&&SH){var it=SH.items[+el.dataset.i];if(el.dataset.f==='on'){it.on=el.checked;drawPreview()}else it[el.dataset.f]=el.value}
  else if(el.id==='restore'&&el.files[0]){
    var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.tx))throw 0;var b=blank();for(var k in b)if(o[k]===undefined)o[k]=b[k];S=o;save();render();toast('Yedek yüklendi')}catch(x){toast('Geçersiz yedek dosyası')}};r.readAsText(el.files[0]);
  }
});
/* sayfa herhangi bir yerde yapıştırılırsa SMS olarak aç */
document.addEventListener('paste',function(e){
  var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  var txt=(e.clipboardData&&e.clipboardData.getData('text'))||'';
  if(!txt.trim())return;
  openSheet('paste',{text:txt,items:parseSMS(txt,today())});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&SH)closeSheet()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!SH)render()});

/* test için */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
window.__hayatim={parseSMS:parseSMS,parseAmount:parseAmount};
render();
})();
</script>
